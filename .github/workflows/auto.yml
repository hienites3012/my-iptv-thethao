name: Auto Crawl Football IPTV

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install curl_cffi requests

      - name: Run script
        run: python update_iptv.py

      - name: Commit and Push playlist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update football matches"
          file_pattern: "playlist.m3u"